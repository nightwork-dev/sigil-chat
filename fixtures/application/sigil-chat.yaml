agent:
  model: gpt-5.6-terra

  # Selectable model entries. Vendors live here, never in TypeScript: the
  # resolver only knows transport kinds (codex / openai-compatible /
  # openrouter / anthropic), and everything that makes DeepSeek different
  # from Moonshot from a local LM Studio server is data on these rows.
  # Adding a hosted OpenAI-compatible provider is an entry here plus its
  # credential in the Eve environment — no code change.
  #
  # Credentials are read from the environment by NAME. Never put a key here.
  #
  # Base URLs below were verified to exist and require auth (HTTP 401 on
  # /models, 2026-07-31). The `model` on each hosted row is the vendor's
  # documented default and can drift — Settings → Models → Probe lists what a
  # given endpoint actually serves, which is the way to confirm it.
  presets:
    # David's first per-session use: same Codex subscription as the default,
    # different model. No new credential, so selecting it needs nothing beyond
    # the `codex login` the deployment already has.
    - id: luna
      label: GPT-5.6 Luna (Codex subscription)
      provider: codex
      model: gpt-5.6-luna

    - id: lmstudio-local
      label: LM Studio (local)
      provider: openai-compatible
      model: qwen3.6-27b
      baseUrl: http://127.0.0.1:1234/v1
      contextWindowTokens: 262144

    - id: deepseek
      label: DeepSeek
      provider: openai-compatible
      model: deepseek-chat
      baseUrl: https://api.deepseek.com/v1
      apiKeyEnv: SIGIL_MODEL_DEEPSEEK_API_KEY
      contextWindowTokens: 65536

    - id: moonshot
      label: Moonshot (Kimi)
      provider: openai-compatible
      model: kimi-k2-0905-preview
      baseUrl: https://api.moonshot.ai/v1
      apiKeyEnv: SIGIL_MODEL_MOONSHOT_API_KEY
      contextWindowTokens: 131072

    - id: zai
      label: z.ai (GLM)
      provider: openai-compatible
      model: glm-4.6
      baseUrl: https://api.z.ai/api/paas/v4
      apiKeyEnv: SIGIL_MODEL_ZAI_API_KEY
      contextWindowTokens: 131072

auth:
  registration: closed

branding:
  name: Sigil Chat
  title: Sigil Chat — agentic conversations
  description: An agentic chat workspace built with Sigil and Gonk.
  accent: "#b58b35"
  shareImageUrl: /icon-512.png

imageEdit:
  preset: flux2klein4b
  quality: fast
