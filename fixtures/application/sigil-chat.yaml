agent:
  model: gpt-5.6-terra

  # Provider entries. A provider states its transport kind, endpoint, and
  # credential ONCE and fans out the models it offers; vendors live here, never
  # in TypeScript. Adding a hosted OpenAI-compatible vendor is an entry here
  # plus its credential in the Eve environment — no code change.
  #
  # Credentials are read from the environment by NAME. Never put a key here.
  #
  # A model's selectable id is "<providerId>/<modelId>" — that is what a
  # session's immutable binding records, so renaming either slug retires the
  # old id (sessions bound to it fall back to the deployment default, loudly).
  #
  # Authoring a provider here does NOT make its models usable. A new chat may
  # only run a model an owner has switched on in Settings -> Models; everything
  # below therefore starts unavailable, and codex/sol in particular stays
  # unreachable until David enables it. `enabled` (provider and model) is the
  # author's veto over that: `false` means no owner can turn it on from the UI.
  #
  # `capability` (chat/embedding/voice) is accepted and normalized but not yet
  # consumed — shaped now so the embedding work lands without another reshape.
  #
  # `pricing` (provider-level default, model-level override) is USD per 1M
  # tokens and is entirely optional (MDL.3) — Settings -> Usage meters token
  # counts regardless and only turns them into a cost when a rate is present.
  # Rates go stale; this fixture only prices what needs no ongoing upkeep to
  # stay true (a $0 local endpoint). Fill in a vendor's published per-1M-token
  # rate here to see its cost in Settings -> Usage.
  #
  # Base URLs below were verified to exist and require auth (HTTP 401 on
  # /models, 2026-07-31). Hosted `model` ids are the vendor's documented
  # default and can drift — Settings -> Models -> Probe lists what an endpoint
  # actually serves, which is the way to confirm them.
  providers:
    - id: codex
      label: Codex subscription
      kind: codex
      models:
        # David's first per-session use: same subscription as the deployment
        # default, different model. No new credential needed.
        - id: luna
          model: gpt-5.6-luna
          label: GPT-5.6 Luna
          # Codex/OpenAI Responses reasoningEffort vocabulary, weakest first
          # (verified against the bundled @ai-sdk/openai schema, 2026-07-31).
          # "off" is Sigil's own label for the provider's "none" — the resolver
          # translates it (see reasoning-provider-options.ts).
          reasoning:
            levels: [off, low, medium, high, xhigh, max]
            default: medium
          fastMode: true
        - id: sol
          model: gpt-5.6-sol
          label: GPT-5.6 Sol
          reasoning:
            levels: [off, low, medium, high, xhigh, max]
            default: medium
          fastMode: true

    - id: lmstudio-local
      label: LM Studio (local)
      kind: openai-compatible
      baseUrl: http://127.0.0.1:1234/v1
      contextWindowTokens: 262144
      pricing:
        inputPerMillionTokens: 0
        outputPerMillionTokens: 0
      models:
        - id: qwen
          model: qwen3.6-27b

    - id: deepseek
      label: DeepSeek
      kind: openai-compatible
      baseUrl: https://api.deepseek.com/v1
      apiKeyEnv: SIGIL_MODEL_DEEPSEEK_API_KEY
      contextWindowTokens: 65536
      models:
        - id: chat
          model: deepseek-chat

    - id: moonshot
      label: Moonshot (Kimi)
      kind: openai-compatible
      baseUrl: https://api.moonshot.ai/v1
      apiKeyEnv: SIGIL_MODEL_MOONSHOT_API_KEY
      contextWindowTokens: 131072
      models:
        - id: k2
          model: kimi-k2-0905-preview

    - id: zai
      label: z.ai (GLM)
      kind: openai-compatible
      baseUrl: https://api.z.ai/api/paas/v4
      apiKeyEnv: SIGIL_MODEL_ZAI_API_KEY
      contextWindowTokens: 131072
      models:
        - id: glm
          model: glm-4.6

auth:
  registration: closed

branding:
  name: Sigil Chat
  title: Sigil Chat — agentic conversations
  description: An agentic chat workspace built with Sigil and Gonk.
  accent: "#b58b35"
  shareImageUrl: /icon-512.png

imageEdit:
  preset: flux2klein4b
  quality: fast
